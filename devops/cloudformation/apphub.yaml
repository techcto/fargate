{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Fargate App Hub shared hosting platform: ECS cluster and shared ALB; independent CloudFormation application stacks.",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PublicSubnets": {
      "Type": "CommaDelimitedList",
      "Default": ""
    },
    "CertificateArn": {
      "Type": "String",
      "Description": "Default issued ACM certificate for the HTTPS listener.",
      "Default": ""
    },
    "LoadBalancerMode": {
      "Type": "String",
      "Default": "Create",
      "AllowedValues": [
        "Create",
        "Existing",
        "None"
      ],
      "Description": "Create a shared ALB, attach an existing HTTPS listener, or launch compute only."
    },
    "ExistingListenerArn": {
      "Type": "String",
      "Default": ""
    },
    "ExistingLoadBalancerSecurityGroup": {
      "Type": "String",
      "Default": ""
    },
    "DatabaseMode": {
      "Type": "String",
      "Default": "None",
      "AllowedValues": [
        "None",
        "Create",
        "Existing"
      ],
      "Description": "Optional shared Aurora MySQL with Data API. Application stacks allocate isolated databases and users."
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>",
      "Description": "Private application and data-service subnets in at least two Availability Zones, with outbound service connectivity."
    },
    "ExistingDatabaseClusterArn": {
      "Type": "String",
      "Default": ""
    },
    "ExistingDatabaseSecretArn": {
      "Type": "String",
      "Default": "",
      "Description": "Administrator secret for an existing Aurora MySQL Data API cluster; never passed to application tasks."
    },
    "ExistingDatabaseEndpoint": {
      "Type": "String",
      "Default": ""
    },
    "ExistingDatabaseSecurityGroup": {
      "Type": "String",
      "Default": ""
    },
    "DatabaseMinCapacity": {
      "Type": "Number",
      "Default": 0.5,
      "MinValue": 0.5,
      "MaxValue": 128
    },
    "DatabaseMaxCapacity": {
      "Type": "Number",
      "Default": 2,
      "MinValue": 0.5,
      "MaxValue": 128
    },
    "DocumentDbMode": {
      "Type": "String",
      "Default": "None",
      "AllowedValues": [
        "None",
        "Create",
        "Existing"
      ],
      "Description": "Optional shared DocumentDB; each application requires a database-scoped tenant user."
    },
    "ExistingDocumentDbArn": {
      "Type": "String",
      "Default": ""
    },
    "ExistingDocumentDbEndpoint": {
      "Type": "String",
      "Default": ""
    },
    "ExistingDocumentDbSecurityGroup": {
      "Type": "String",
      "Default": ""
    },
    "DocumentDbInstanceClass": {
      "Type": "String",
      "Default": "db.t3.medium"
    },
    "FileSystemMode": {
      "Type": "String",
      "Default": "None",
      "AllowedValues": [
        "None",
        "Create",
        "Existing"
      ],
      "Description": "Optional shared encrypted EFS; application stacks own isolated access points."
    },
    "ExistingFileSystemId": {
      "Type": "String",
      "Default": ""
    },
    "ExistingFileSystemSecurityGroup": {
      "Type": "String",
      "Default": ""
    },
    "RedisMode": {
      "Type": "String",
      "Default": "None",
      "AllowedValues": [
        "None",
        "Create",
        "Existing"
      ],
      "Description": "Optional shared Valkey/Redis cache. Applications must have restricted ACL credentials and key prefixes."
    },
    "ExistingRedisArn": {
      "Type": "String",
      "Default": ""
    },
    "ExistingRedisEndpoint": {
      "Type": "String",
      "Default": ""
    },
    "ExistingRedisSecurityGroup": {
      "Type": "String",
      "Default": ""
    },
    "ExistingRedisUserGroupId": {
      "Type": "String",
      "Default": ""
    },
    "EnableBackups": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Enroll selected Aurora, DocumentDB and EFS resources in the daily AWS Backup plan. Redis uses native snapshots."
    },
    "BackupRetentionDays": {
      "Type": "Number",
      "Default": 30,
      "MinValue": 1,
      "MaxValue": 3650
    },
    "BackupSchedule": {
      "Type": "String",
      "Default": "cron(0 5 * * ? *)",
      "Description": "AWS Backup schedule in UTC."
    },
    "DocumentDbAdminPassword": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^[A-Za-z0-9]{32,64}$",
      "ConstraintDescription": "Provide 32 to 64 alphanumeric characters when creating DocumentDB.",
      "Description": "DocumentDB administrator password. Cloud generates this through the buildspec; direct CloudFormation users supply it."
    }
  },
  "Resources": {
    "Cluster": {
      "Type": "AWS::ECS::Cluster",
      "Properties": {
        "ClusterName": {
          "Fn::Sub": "${AWS::StackName}"
        },
        "ClusterSettings": [
          {
            "Name": "containerInsights",
            "Value": "enabled"
          }
        ],
        "Tags": [
          {
            "Key": "Name",
            "Value": "apphub-fargate-cluster"
          },
          {
            "Key": "Platform",
            "Value": "AppHub"
          }
        ],
        "CapacityProviders": [
          "FARGATE"
        ]
      }
    },
    "AlbSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "Public HTTP redirect and HTTPS for shared applications",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          },
          {
            "IpProtocol": "tcp",
            "FromPort": 443,
            "ToPort": 443,
            "CidrIp": "0.0.0.0/0"
          }
        ],
        "Tags": [
          {
            "Key": "Name",
            "Value": "apphub-alb-security-group"
          },
          {
            "Key": "Platform",
            "Value": "AppHub"
          }
        ]
      },
      "Condition": "CreateLoadBalancer"
    },
    "ALB": {
      "Type": "AWS::ElasticLoadBalancingV2::LoadBalancer",
      "Properties": {
        "Scheme": "internet-facing",
        "Type": "application",
        "Subnets": {
          "Ref": "PublicSubnets"
        },
        "SecurityGroups": [
          {
            "Ref": "AlbSecurityGroup"
          }
        ],
        "LoadBalancerAttributes": [
          {
            "Key": "routing.http.drop_invalid_header_fields.enabled",
            "Value": "true"
          }
        ],
        "Tags": [
          {
            "Key": "Name",
            "Value": "apphub-alb"
          },
          {
            "Key": "Platform",
            "Value": "AppHub"
          }
        ]
      },
      "Condition": "CreateLoadBalancer"
    },
    "HttpListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 80,
        "Protocol": "HTTP",
        "DefaultActions": [
          {
            "Type": "redirect",
            "RedirectConfig": {
              "Protocol": "HTTPS",
              "Port": "443",
              "StatusCode": "HTTP_301"
            }
          }
        ]
      },
      "Condition": "CreateLoadBalancer"
    },
    "HttpsListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 443,
        "Protocol": "HTTPS",
        "SslPolicy": "ELBSecurityPolicy-TLS13-1-2-2021-06",
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ],
        "DefaultActions": [
          {
            "Type": "fixed-response",
            "FixedResponseConfig": {
              "StatusCode": "404",
              "ContentType": "text/plain",
              "MessageBody": "Application hostname not configured"
            }
          }
        ]
      },
      "Condition": "CreateLoadBalancer"
    },
    "DatabaseSubnetGroup": {
      "Type": "AWS::RDS::DBSubnetGroup",
      "Condition": "CreateDatabase",
      "Properties": {
        "DBSubnetGroupDescription": "Private App Hub shared database subnets",
        "SubnetIds": {
          "Ref": "PrivateSubnets"
        }
      },
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "DatabaseSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Condition": "CreateDatabase",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "GroupDescription": "App-owned ingress rules grant access to the shared database"
      },
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "Database": {
      "Type": "AWS::RDS::DBCluster",
      "Condition": "CreateDatabase",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "Engine": "aurora-mysql",
        "EngineMode": "provisioned",
        "MasterUsername": "platformadmin",
        "ManageMasterUserPassword": true,
        "EnableHttpEndpoint": true,
        "StorageEncrypted": true,
        "BackupRetentionPeriod": 7,
        "DeletionProtection": false,
        "DBSubnetGroupName": {
          "Ref": "DatabaseSubnetGroup"
        },
        "VpcSecurityGroupIds": [
          {
            "Ref": "DatabaseSecurityGroup"
          }
        ],
        "ServerlessV2ScalingConfiguration": {
          "MinCapacity": {
            "Ref": "DatabaseMinCapacity"
          },
          "MaxCapacity": {
            "Ref": "DatabaseMaxCapacity"
          }
        }
      }
    },
    "DatabaseWriter": {
      "Type": "AWS::RDS::DBInstance",
      "Condition": "CreateDatabase",
      "Properties": {
        "DBClusterIdentifier": {
          "Ref": "Database"
        },
        "Engine": "aurora-mysql",
        "DBInstanceClass": "db.serverless",
        "PubliclyAccessible": false
      },
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "TenantDatabaseRole": {
      "Type": "AWS::IAM::Role",
      "Condition": "HasDatabase",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "AllocateOnlyPlatformTenantDatabases",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "rds-data:ExecuteStatement"
                  ],
                  "Resource": {
                    "Fn::If": [
                      "CreateDatabase",
                      {
                        "Fn::GetAtt": [
                          "Database",
                          "DBClusterArn"
                        ]
                      },
                      {
                        "Ref": "ExistingDatabaseClusterArn"
                      }
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "secretsmanager:GetSecretValue"
                  ],
                  "Resource": {
                    "Fn::If": [
                      "CreateDatabase",
                      {
                        "Fn::GetAtt": [
                          "Database",
                          "MasterUserSecret.SecretArn"
                        ]
                      },
                      {
                        "Ref": "ExistingDatabaseSecretArn"
                      }
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "secretsmanager:GetSecretValue",
                    "secretsmanager:DescribeSecret",
                    "secretsmanager:PutSecretValue"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/spacemade/fargate/${AWS::StackName}/tenants/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "TenantDatabaseLogs",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "TenantDatabaseLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Condition": "HasDatabase",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${AWS::StackName}-tenant-database"
        },
        "RetentionInDays": 90
      }
    },
    "TenantDatabaseProvider": {
      "Type": "AWS::Lambda::Function",
      "Condition": "HasDatabase",
      "Properties": {
        "Runtime": "python3.13",
        "Handler": "index.handler",
        "Timeout": 120,
        "Role": {
          "Fn::GetAtt": [
            "TenantDatabaseRole",
            "Arn"
          ]
        },
        "LoggingConfig": {
          "LogGroup": {
            "Ref": "TenantDatabaseLogs"
          }
        },
        "Environment": {
          "Variables": {
            "CLUSTER_ARN": {
              "Fn::If": [
                "CreateDatabase",
                {
                  "Fn::GetAtt": [
                    "Database",
                    "DBClusterArn"
                  ]
                },
                {
                  "Ref": "ExistingDatabaseClusterArn"
                }
              ]
            },
            "ADMIN_SECRET_ARN": {
              "Fn::If": [
                "CreateDatabase",
                {
                  "Fn::GetAtt": [
                    "Database",
                    "MasterUserSecret.SecretArn"
                  ]
                },
                {
                  "Ref": "ExistingDatabaseSecretArn"
                }
              ]
            },
            "PLATFORM_STACK_ID": {
              "Ref": "AWS::StackId"
            }
          }
        },
        "Code": {
          "ZipFile": "\"\"\"CloudFormation-only tenant database allocation on the host's Aurora MySQL.\n\nCredentials never appear in the custom-resource response or logs. Database and\nuser identities derive from the application stack, not caller-supplied SQL.\n\"\"\"\nimport hashlib\nimport json\nimport os\nimport re\nimport urllib.request\n\nimport boto3\n\n\ndef identities(stack_id):\n    digest = hashlib.sha256(stack_id.encode()).hexdigest()\n    return 'd' + digest[:32], 'u' + digest[:24]\n\n\ndef provision(event, secrets, data, environment):\n    stack = event['StackId']\n    if not stack.startswith('arn:aws:cloudformation:'):\n        raise ValueError('Invalid application stack identity')\n    database, username = identities(stack)\n    physical_id = environment['CLUSTER_ARN'] + '/' + database\n    props = event['ResourceProperties']\n    secret_arn = props['TenantSecretArn']\n    # The execution role scopes access to this platform's tenant secret prefix.\n    secret = secrets.describe_secret(SecretId=secret_arn)\n    tags = {tag['Key']: tag['Value'] for tag in secret.get('Tags', [])}\n    if tags.get('PlatformStackId') != environment['PLATFORM_STACK_ID'] or tags.get('ApplicationStackId') != stack:\n        raise ValueError('Tenant secret does not belong to this application and platform')\n    if event['RequestType'] == 'Update':\n        old = event.get('OldResourceProperties', {})\n        if old.get('TenantSecretArn') != secret_arn:\n            raise ValueError('Changing a database allocation secret requires an explicit migration')\n    if event.get('PhysicalResourceId', physical_id) != physical_id:\n        raise ValueError('Database allocation identity mismatch')\n    if event['RequestType'] == 'Delete':\n        # The provider cannot drop tenant data. Removal/retention is a separate\n        # reviewed data lifecycle; rollback must never destroy an existing DB.\n        return physical_id, {'DatabaseName': database, 'DatabaseUser': username, 'Retained': True}\n    if event['RequestType'] not in ('Create', 'Update'):\n        raise ValueError('Unsupported CloudFormation request')\n    values = json.loads(secrets.get_secret_value(SecretId=secret_arn)['SecretString'])\n    password = values['db_password']\n    if not isinstance(password, str) or not re.fullmatch(r'[A-Za-z0-9]{32,64}', password):\n        raise ValueError('Tenant database password must be generated alphanumeric credentials')\n    args = {'resourceArn': environment['CLUSTER_ARN'], 'secretArn': environment['ADMIN_SECRET_ARN']}\n    # Identifiers are hex-only; passwords are validated alphanumeric. The SQL\n    # grammar never includes hostnames, names, or statements supplied by callers.\n    statements = [\n        f'CREATE DATABASE IF NOT EXISTS `{database}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci',\n        f\"CREATE USER IF NOT EXISTS '{username}'@'%' IDENTIFIED BY '{password}'\",\n        f\"ALTER USER '{username}'@'%' IDENTIFIED BY '{password}'\",\n        f\"GRANT ALL PRIVILEGES ON `{database}`.* TO '{username}'@'%'\",\n    ]\n    for statement in statements:\n        data.execute_statement(**args, sql=statement)\n    values.update(db_user=username, db_database=database)\n    secrets.put_secret_value(SecretId=secret_arn, SecretString=json.dumps(values), ClientRequestToken=event['RequestId'])\n    return physical_id, {'DatabaseName': database, 'DatabaseUser': username, 'TenantSecretArn': secret_arn}\n\n\ndef handler(event, context):\n    physical_id = event.get('PhysicalResourceId', context.log_stream_name)\n    result = {}\n    status = 'FAILED'\n    try:\n        physical_id, result = provision(event, boto3.client('secretsmanager'), boto3.client('rds-data'), os.environ)\n        status = 'SUCCESS'\n    except Exception:\n        # SQL service errors can contain credentials. Do not return or log them.\n        pass\n    response = {\n        'Status': status,\n        'Reason': 'Tenant database allocation completed' if status == 'SUCCESS' else 'Tenant database allocation failed; verify platform ownership, credentials and Data API availability',\n        'PhysicalResourceId': physical_id,\n        'StackId': event['StackId'], 'RequestId': event['RequestId'],\n        'LogicalResourceId': event['LogicalResourceId'], 'NoEcho': True, 'Data': result,\n    }\n    body = json.dumps(response).encode()\n    request = urllib.request.Request(event['ResponseURL'], data=body, method='PUT', headers={'Content-Type': '', 'Content-Length': str(len(body))})\n    with urllib.request.urlopen(request, timeout=20) as connection:\n        connection.read()\n"
        }
      }
    },
    "DocumentDbSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "GroupDescription": "App-owned ingress permits access to shared DocumentDB"
      },
      "Condition": "CreateDocumentDb",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "DocumentDbSubnetGroup": {
      "Type": "AWS::DocDB::DBSubnetGroup",
      "Condition": "CreateDocumentDb",
      "Properties": {
        "DBSubnetGroupDescription": "App Hub private DocumentDB subnets",
        "SubnetIds": {
          "Ref": "PrivateSubnets"
        }
      },
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "DocumentDbAdminSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "Condition": "CreateDocumentDb",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "SecretString": {
          "Fn::Sub": "{\"username\":\"platformadmin\",\"password\":\"${DocumentDbAdminPassword}\"}"
        }
      }
    },
    "DocumentDb": {
      "Type": "AWS::DocDB::DBCluster",
      "Condition": "CreateDocumentDb",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "MasterUsername": "platformadmin",
        "MasterUserPassword": {
          "Fn::Sub": "{{resolve:secretsmanager:${DocumentDbAdminSecret}:SecretString:password}}"
        },
        "DBSubnetGroupName": {
          "Ref": "DocumentDbSubnetGroup"
        },
        "VpcSecurityGroupIds": [
          {
            "Ref": "DocumentDbSecurityGroup"
          }
        ],
        "StorageEncrypted": true,
        "BackupRetentionPeriod": 7,
        "DeletionProtection": false
      }
    },
    "DocumentDbWriter": {
      "Type": "AWS::DocDB::DBInstance",
      "Condition": "CreateDocumentDb",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "DBClusterIdentifier": {
          "Ref": "DocumentDb"
        },
        "DBInstanceClass": {
          "Ref": "DocumentDbInstanceClass"
        },
        "AutoMinorVersionUpgrade": true
      }
    },
    "FileSystemSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "GroupDescription": "App-owned access-point clients connect to EFS"
      },
      "Condition": "CreateFileSystem"
    },
    "FileSystem": {
      "Type": "AWS::EFS::FileSystem",
      "Condition": "CreateFileSystem",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "Encrypted": true,
        "FileSystemPolicy": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": [
                "elasticfilesystem:ClientMount",
                "elasticfilesystem:ClientWrite",
                "elasticfilesystem:ClientRootAccess"
              ],
              "Resource": "*",
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      }
    },
    "FileSystemMount1": {
      "Type": "AWS::EFS::MountTarget",
      "Condition": "CreateFileSystem",
      "Properties": {
        "FileSystemId": {
          "Ref": "FileSystem"
        },
        "SubnetId": {
          "Fn::Select": [
            0,
            {
              "Ref": "PrivateSubnets"
            }
          ]
        },
        "SecurityGroups": [
          {
            "Ref": "FileSystemSecurityGroup"
          }
        ]
      }
    },
    "FileSystemMount2": {
      "Type": "AWS::EFS::MountTarget",
      "Condition": "CreateFileSystem",
      "Properties": {
        "FileSystemId": {
          "Ref": "FileSystem"
        },
        "SubnetId": {
          "Fn::Select": [
            1,
            {
              "Ref": "PrivateSubnets"
            }
          ]
        },
        "SecurityGroups": [
          {
            "Ref": "FileSystemSecurityGroup"
          }
        ]
      }
    },
    "RedisSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "GroupDescription": "App-owned ingress permits TLS cache connections"
      },
      "Condition": "CreateRedis",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "RedisUserGroup": {
      "Type": "AWS::ElastiCache::UserGroup",
      "Condition": "CreateRedis",
      "Properties": {
        "UserGroupId": {
          "Fn::Join": [
            "",
            [
              "hub-",
              {
                "Fn::Select": [
                  2,
                  {
                    "Fn::Split": [
                      "/",
                      {
                        "Ref": "AWS::StackId"
                      }
                    ]
                  }
                ]
              }
            ]
          ]
        },
        "Engine": "valkey"
      },
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete"
    },
    "Redis": {
      "Type": "AWS::ElastiCache::ServerlessCache",
      "Condition": "CreateRedis",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "ServerlessCacheName": {
          "Fn::Join": [
            "",
            [
              "hub-",
              {
                "Fn::Select": [
                  2,
                  {
                    "Fn::Split": [
                      "/",
                      {
                        "Ref": "AWS::StackId"
                      }
                    ]
                  }
                ]
              }
            ]
          ]
        },
        "Engine": "valkey",
        "SubnetIds": {
          "Ref": "PrivateSubnets"
        },
        "SecurityGroupIds": [
          {
            "Ref": "RedisSecurityGroup"
          }
        ],
        "UserGroupId": {
          "Ref": "RedisUserGroup"
        },
        "SnapshotRetentionLimit": 7,
        "DailySnapshotTime": "05:00"
      }
    },
    "BackupVault": {
      "Type": "AWS::Backup::BackupVault",
      "Condition": "EnableDataBackups",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "BackupVaultName": {
          "Fn::Join": [
            "",
            [
              "hub-",
              {
                "Fn::Select": [
                  2,
                  {
                    "Fn::Split": [
                      "/",
                      {
                        "Ref": "AWS::StackId"
                      }
                    ]
                  }
                ]
              }
            ]
          ]
        }
      }
    },
    "BackupRole": {
      "Type": "AWS::IAM::Role",
      "Condition": "EnableDataBackups",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "backup.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
          },
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"
          }
        ]
      }
    },
    "BackupPlan": {
      "Type": "AWS::Backup::BackupPlan",
      "Condition": "EnableDataBackups",
      "Properties": {
        "BackupPlan": {
          "BackupPlanName": "Fargate App Hub shared data",
          "BackupPlanRule": [
            {
              "RuleName": "daily-shared-data",
              "TargetBackupVault": {
                "Ref": "BackupVault"
              },
              "ScheduleExpression": {
                "Ref": "BackupSchedule"
              },
              "StartWindowMinutes": 60,
              "CompletionWindowMinutes": 360,
              "Lifecycle": {
                "DeleteAfterDays": {
                  "Ref": "BackupRetentionDays"
                }
              }
            }
          ]
        }
      }
    },
    "BackupSelection": {
      "Type": "AWS::Backup::BackupSelection",
      "Condition": "EnableDataBackups",
      "Properties": {
        "BackupPlanId": {
          "Ref": "BackupPlan"
        },
        "BackupSelection": {
          "SelectionName": "apphub-shared-data",
          "IamRoleArn": {
            "Fn::GetAtt": [
              "BackupRole",
              "Arn"
            ]
          },
          "Resources": [
            {
              "Fn::If": [
                "HasDatabase",
                {
                  "Fn::If": [
                    "CreateDatabase",
                    {
                      "Fn::GetAtt": [
                        "Database",
                        "DBClusterArn"
                      ]
                    },
                    {
                      "Ref": "ExistingDatabaseClusterArn"
                    }
                  ]
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            },
            {
              "Fn::If": [
                "HasDocumentDb",
                {
                  "Fn::If": [
                    "CreateDocumentDb",
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${DocumentDb}"
                    },
                    {
                      "Ref": "ExistingDocumentDbArn"
                    }
                  ]
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            },
            {
              "Fn::If": [
                "HasFileSystem",
                {
                  "Fn::Sub": [
                    "arn:${AWS::Partition}:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${FileSystemId}",
                    {
                      "FileSystemId": {
                        "Fn::If": [
                          "CreateFileSystem",
                          {
                            "Ref": "FileSystem"
                          },
                          {
                            "Ref": "ExistingFileSystemId"
                          }
                        ]
                      }
                    }
                  ]
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            }
          ]
        }
      }
    },
    "TaskEvents": {
      "Type": "AWS::Logs::LogGroup",
      "DeletionPolicy": "Delete",
      "UpdateReplacePolicy": "Delete",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/spacemade/fargate/${AWS::StackName}/task-events"
        },
        "RetentionInDays": 90
      }
    },
    "TaskEventsPolicy": {
      "Type": "AWS::Logs::ResourcePolicy",
      "Properties": {
        "PolicyName": {
          "Fn::Join": [
            "",
            [
              "hub-",
              {
                "Fn::Select": [
                  2,
                  {
                    "Fn::Split": [
                      "/",
                      {
                        "Ref": "AWS::StackId"
                      }
                    ]
                  }
                ]
              }
            ]
          ]
        },
        "PolicyDocument": {
          "Fn::Sub": [
            "{\"Version\": \"2012-10-17\", \"Statement\": [{\"Effect\": \"Allow\", \"Principal\": {\"Service\": \"events.amazonaws.com\"}, \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"], \"Resource\": \"arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${TaskEvents}:*\", \"Condition\": {\"StringEquals\": {\"aws:SourceAccount\": \"${AWS::AccountId}\"}, \"ArnEquals\": {\"aws:SourceArn\": \"arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${RuleName}\"}}}]}",
            {
              "RuleName": {
                "Fn::Join": [
                  "",
                  [
                    "hub-",
                    {
                      "Fn::Select": [
                        2,
                        {
                          "Fn::Split": [
                            "/",
                            {
                              "Ref": "AWS::StackId"
                            }
                          ]
                        }
                      ]
                    }
                  ]
                ]
              }
            }
          ]
        }
      }
    },
    "TaskEventsRule": {
      "Type": "AWS::Events::Rule",
      "DependsOn": "TaskEventsPolicy",
      "Properties": {
        "Name": {
          "Fn::Join": [
            "",
            [
              "hub-",
              {
                "Fn::Select": [
                  2,
                  {
                    "Fn::Split": [
                      "/",
                      {
                        "Ref": "AWS::StackId"
                      }
                    ]
                  }
                ]
              }
            ]
          ]
        },
        "State": "ENABLED",
        "EventPattern": {
          "source": [
            "aws.ecs"
          ],
          "detail-type": [
            "ECS Task State Change"
          ],
          "detail": {
            "clusterArn": [
              {
                "Fn::GetAtt": [
                  "Cluster",
                  "Arn"
                ]
              }
            ]
          }
        },
        "Targets": [
          {
            "Id": "task-lifecycle-journal",
            "Arn": {
              "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${TaskEvents}"
            }
          }
        ]
      }
    }
  },
