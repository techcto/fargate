{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "CMS on existing Fargate App Hub infrastructure. Requires pre-provisioned tenant databases, secret and network connectivity.",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "ServiceSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "LoadBalancerSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id"
    },
    "Cluster": {
      "Type": "String",
      "MinLength": 1
    },
    "ListenerArn": {
      "Type": "String",
      "MinLength": 1
    },
    "EfsFileSystemId": {
      "Type": "String",
      "MinLength": 1
    },
    "TenantSecretArn": {
      "Type": "String",
      "MinLength": 1
    },
    "Hostname": {
      "Type": "String",
      "AllowedPattern": "[a-z0-9][a-z0-9.-]*\\.[a-z]{2,}",
      "MaxLength": 253
    },
    "ListenerPriority": {
      "Type": "Number",
      "MinValue": 1,
      "MaxValue": 49999
    },
    "CmsImage": {
      "Type": "String",
      "AllowedPattern": ".+@sha256:[a-f0-9]{64}",
      "Description": "Approved immutable image from the same CMS release."
    },
    "UiImage": {
      "Type": "String",
      "AllowedPattern": ".+@sha256:[a-f0-9]{64}",
      "Description": "Approved immutable image from the same CMS release."
    },
    "TaskCpu": {
      "Type": "String",
      "AllowedValues": [
        "512",
        "1024",
        "2048",
        "4096"
      ],
      "Default": "1024"
    },
    "TaskMemory": {
      "Type": "String",
      "Default": "2048",
      "Description": "A valid ECS Fargate memory value for TaskCpu."
    },
    "DatabaseHost": {
      "Type": "String",
      "MinLength": 1
    },
    "DatabaseName": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z][A-Za-z0-9_]{0,63}"
    },
    "MongoHost": {
      "Type": "String",
      "MinLength": 1,
      "Description": "Tenant-specific Mongo endpoint; the current CMS uses a fixed solodev_views database."
    },
    "RedisHost": {
      "Type": "String",
      "MinLength": 1,
      "Description": "Tenant-specific Redis endpoint including port."
    },
    "DatabaseSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id"
    },
    "EfsSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id"
    },
    "SsoProviderUrl": {
      "Type": "String",
      "AllowedPattern": "https://.+"
    },
    "SsoClientId": {
      "Type": "String",
      "MinLength": 1
    },
    "SsoScopes": {
      "Type": "String",
      "Default": "openid email profile roles"
    },
    "MongoSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id"
    },
    "RedisSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id"
    }
  },
  "Resources": {
    "Logs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 30
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "ServiceSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "GroupDescription": "CMS tenant task traffic",
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 8080,
            "ToPort": 8080,
            "SourceSecurityGroupId": {
              "Ref": "LoadBalancerSecurityGroup"
            }
          }
        ]
      }
    },
    "SqlIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "DatabaseSecurityGroup"
        },
        "IpProtocol": "tcp",
        "FromPort": 3306,
        "ToPort": 3306,
        "SourceSecurityGroupId": {
          "Ref": "ServiceSecurityGroup"
        }
      }
    },
    "EfsIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "EfsSecurityGroup"
        },
        "IpProtocol": "tcp",
        "FromPort": 2049,
        "ToPort": 2049,
        "SourceSecurityGroupId": {
          "Ref": "ServiceSecurityGroup"
        }
      }
    },
    "ClientAccessPoint": {
      "Type": "AWS::EFS::AccessPoint",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "FileSystemId": {
          "Ref": "EfsFileSystemId"
        },
        "PosixUser": {
          "Uid": "82",
          "Gid": "82"
        },
        "RootDirectory": {
          "Path": {
            "Fn::Sub": "/cms/${AWS::StackName}"
          },
          "CreationInfo": {
            "OwnerUid": "82",
            "OwnerGid": "82",
            "Permissions": "0770"
          }
        }
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "PullImagesReadTenantSecretAndWriteLogs",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecr:GetAuthorizationToken"
                  ],
                  "Resource": "*"
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:BatchGetImage"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "secretsmanager:GetSecretValue"
                  ],
                  "Resource": {
                    "Ref": "TenantSecretArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "Logs",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "TaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "TenantClientStorage",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "elasticfilesystem:ClientMount",
                    "elasticfilesystem:ClientWrite"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${EfsFileSystemId}"
                  },
                  "Condition": {
                    "StringEquals": {
                      "elasticfilesystem:AccessPointArn": {
                        "Fn::GetAtt": [
                          "ClientAccessPoint",
                          "Arn"
                        ]
                      }
                    },
                    "Bool": {
                      "aws:SecureTransport": "true"
                    }
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "TargetGroup": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 8080,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/healthcheck",
        "Matcher": {
          "HttpCode": "200"
        },
        "TargetGroupAttributes": [
          {
            "Key": "deregistration_delay.timeout_seconds",
            "Value": "30"
          }
        ]
      }
    },
    "HostRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "ListenerArn"
        },
        "Priority": {
          "Ref": "ListenerPriority"
        },
        "Conditions": [
          {
            "Field": "host-header",
            "HostHeaderConfig": {
              "Values": [
                {
                  "Ref": "Hostname"
                }
              ]
            }
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "TargetGroup"
            }
          }
        ]
      }
    },
    "TaskDefinition": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "Cpu": {
          "Ref": "TaskCpu"
        },
        "Memory": {
          "Ref": "TaskMemory"
        },
        "NetworkMode": "awsvpc",
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "RuntimePlatform": {
          "CpuArchitecture": "X86_64",
          "OperatingSystemFamily": "LINUX"
        },
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "cms",
            "Image": {
              "Ref": "CmsImage"
            },
            "Essential": true,
            "MountPoints": [
              {
                "SourceVolume": "client",
                "ContainerPath": "/var/www/solodev/clients/solodev",
                "ReadOnly": false
              }
            ],
            "Environment": [
              {
                "Name": "APP_ENV",
                "Value": "prod"
              },
              {
                "Name": "APP_URL",
                "Value": "127.0.0.1:9000"
              },
              {
                "Name": "APP_PUBLIC_URL",
                "Value": {
                  "Fn::Sub": "https://${Hostname}"
                }
              },
              {
                "Name": "AWS_REGION",
                "Value": {
                  "Ref": "AWS::Region"
                }
              },
              {
                "Name": "DB_HOST",
                "Value": {
                  "Ref": "DatabaseHost"
                }
              },
              {
                "Name": "DB_NAME",
                "Value": {
                  "Ref": "DatabaseName"
                }
              },
              {
                "Name": "MONGO_HOST",
                "Value": {
                  "Ref": "MongoHost"
                }
              },
              {
                "Name": "REDIS_HOST",
                "Value": {
                  "Ref": "RedisHost"
                }
              },
              {
                "Name": "SSO_PROVIDER_URL",
                "Value": {
                  "Ref": "SsoProviderUrl"
                }
              },
              {
                "Name": "SSO_CLIENT_ID",
                "Value": {
                  "Ref": "SsoClientId"
                }
              },
              {
                "Name": "SSO_CLIENT_SCOPES",
                "Value": {
                  "Ref": "SsoScopes"
                }
              }
            ],
            "Secrets": [
              {
                "Name": "DB_USER",
                "ValueFrom": {
                  "Fn::Sub": "${TenantSecretArn}:db_user::"
                }
              },
              {
                "Name": "DB_PASSWORD",
                "ValueFrom": {
                  "Fn::Sub": "${TenantSecretArn}:db_password::"
                }
              },
              {
                "Name": "APP_SECRET",
                "ValueFrom": {
                  "Fn::Sub": "${TenantSecretArn}:app_secret::"
                }
              },
              {
                "Name": "SOLODEV_USER",
                "ValueFrom": {
                  "Fn::Sub": "${TenantSecretArn}:admin_user::"
                }
              },
              {
                "Name": "SOLODEV_PASSWORD",
                "ValueFrom": {
                  "Fn::Sub": "${TenantSecretArn}:admin_password::"
                }
              },
              {
                "Name": "SSO_CLIENT_SECRET",
                "ValueFrom": {
                  "Fn::Sub": "${TenantSecretArn}:sso_client_secret::"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "Logs"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "cms"
              }
            }
          },
          {
            "Name": "ui",
            "Image": {
              "Ref": "UiImage"
            },
            "Essential": true,
            "MountPoints": [
              {
                "SourceVolume": "client",
                "ContainerPath": "/var/www/solodev/clients/solodev",
                "ReadOnly": false
              }
            ],
            "Environment": [
              {
                "Name": "APP_ENV",
                "Value": "prod"
              },
              {
                "Name": "APP_URL",
                "Value": "127.0.0.1:9000"
              },
              {
                "Name": "APP_PUBLIC_URL",
                "Value": {
                  "Fn::Sub": "https://${Hostname}"
                }
              },
              {
                "Name": "AWS_REGION",
                "Value": {
                  "Ref": "AWS::Region"
                }
              }
            ],
            "DependsOn": [
              {
                "ContainerName": "cms",
                "Condition": "START"
              }
            ],
            "PortMappings": [
              {
                "ContainerPort": 8080,
                "Protocol": "tcp"
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "Logs"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "ui"
              }
            }
          }
        ],
        "Volumes": [
          {
            "Name": "client",
            "EFSVolumeConfiguration": {
              "FilesystemId": {
                "Ref": "EfsFileSystemId"
              },
              "TransitEncryption": "ENABLED",
              "AuthorizationConfig": {
                "AccessPointId": {
                  "Ref": "ClientAccessPoint"
                },
                "IAM": "ENABLED"
              }
            }
          }
        ]
      }
    },
    "Service": {
      "Type": "AWS::ECS::Service",
      "DependsOn": [
        "HostRule",
        "SqlIngress",
        "EfsIngress",
        "MongoIngress",
        "RedisIngress"
      ],
      "Properties": {
        "Cluster": {
          "Ref": "Cluster"
        },
        "LaunchType": "FARGATE",
        "PlatformVersion": "1.4.0",
        "DesiredCount": 1,
        "TaskDefinition": {
          "Ref": "TaskDefinition"
        },
        "HealthCheckGracePeriodSeconds": 180,
        "DeploymentConfiguration": {
          "MaximumPercent": 100,
          "MinimumHealthyPercent": 0,
          "DeploymentCircuitBreaker": {
            "Enable": true,
            "Rollback": true
          }
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "ServiceSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSecurityGroup"
              }
            ]
          }
        },
        "LoadBalancers": [
          {
            "ContainerName": "ui",
            "ContainerPort": 8080,
            "TargetGroupArn": {
              "Ref": "TargetGroup"
            }
          }
        ]
      }
    },
    "MongoIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "MongoSecurityGroup"
        },
        "IpProtocol": "tcp",
        "FromPort": 27017,
        "ToPort": 27017,
        "SourceSecurityGroupId": {
          "Ref": "ServiceSecurityGroup"
        }
      }
    },
    "RedisIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "RedisSecurityGroup"
        },
        "IpProtocol": "tcp",
        "FromPort": 6379,
        "ToPort": 6379,
        "SourceSecurityGroupId": {
          "Ref": "ServiceSecurityGroup"
        }
      }
    }
  },
  "Outputs": {
    "AdminUrl": {
      "Value": {
        "Fn::Sub": "https://${Hostname}"
      }
    },
    "ServiceArn": {
      "Value": {
        "Ref": "Service"
      }
    },
    "ClientAccessPointArn": {
      "Value": {
        "Fn::GetAtt": [
          "ClientAccessPoint",
          "Arn"
        ]
      }
    },
    "Engine": {
      "Value": "fargate"
    }
  }
}
